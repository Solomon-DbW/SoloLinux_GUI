### windows and workspaces ###
##############################

# windowrulev2 = suppressevent maximize, class:.*
# windowrule = tile 1, match:class ^(com-cburch-logisim-Main)$
follow_mouse = 1
mouse_refocus = false
windowrule = tile on, match:class ^(kitty)$
windowrule = suppress_event maximize, match:class .*
